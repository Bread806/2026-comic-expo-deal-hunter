<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漫博 2026 攤位標記工具</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Microsoft JhengHei", sans-serif; }
    #app { display: flex; height: 100vh; }
    #sidebar { width: 340px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
    #sidebar h1 { font-size: 18px; margin: 0; padding: 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    #scale-badge { font-size: 12px; font-weight: normal; color: #666; background: #f3f4f6; padding: 4px 8px; border-radius: 12px; }
    #list { flex: 1; overflow-y: auto; padding: 12px; }
    .item { padding: 10px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
    .item:hover, .item.active { background: #f3f4f6; }
    .item-name { font-weight: 600; font-size: 14px; }
    .item-coords { font-size: 12px; color: #666; margin-top: 4px; }
    #controls { padding: 12px; border-top: 1px solid #eee; display: flex; flex-direction: column; gap: 8px; }
    #controls .row { display: flex; gap: 8px; }
    #controls button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #111; color: #fff; }
    .btn-secondary { background: #eee; color: #111; }
    .btn-danger { background: #fee2e2; color: #991b1b; }
    #canvas-area { flex: 1; position: relative; overflow: hidden; background: #222; }
    #canvas { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transform-origin: center center; cursor: crosshair; }
    #map-img { display: block; max-width: none; max-height: none; user-select: none; -webkit-user-drag: none; }
    .bbox { position: absolute; border: 2px solid #3b82f6; background: rgba(59, 130, 246, 0.15); cursor: move; }
    .bbox.selected { border-color: #f59e0b; background: rgba(245, 158, 11, 0.3); z-index: 100; }
    .bbox-label { position: absolute; top: -20px; left: 0; background: #3b82f6; color: #fff; font-size: 12px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
    .bbox.selected .bbox-label { background: #f59e0b; }
    .handle { position: absolute; width: 10px; height: 10px; background: #fff; border: 2px solid #f59e0b; border-radius: 50%; z-index: 101; }
    .handle.nw { top: -6px; left: -6px; cursor: nw-resize; }
    .handle.ne { top: -6px; right: -6px; cursor: ne-resize; }
    .handle.sw { bottom: -6px; left: -6px; cursor: sw-resize; }
    .handle.se { bottom: -6px; right: -6px; cursor: se-resize; }
    .handle.n { top: -6px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
    .handle.s { bottom: -6px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
    .handle.w { left: -6px; top: 50%; transform: translateY(-50%); cursor: w-resize; }
    .handle.e { right: -6px; top: 50%; transform: translateY(-50%); cursor: e-resize; }
    .dragging { border-color: #ef4444 !important; background: rgba(239, 68, 68, 0.2) !important; }
    #help { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.75); color: #fff; padding: 12px 14px; border-radius: 8px; font-size: 12px; max-width: 320px; line-height: 1.6; }
    #zoom-controls { position: absolute; bottom: 16px; right: 16px; display: flex; gap: 8px; }
    #zoom-controls button { width: 40px; height: 40px; border-radius: 50%; border: none; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 20px; cursor: pointer; }
    input[type="text"], input[type="file"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
    #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <h1>
        攤位標記工具
        <span id="scale-badge">100%</span>
      </h1>
      <div id="list"></div>
      <div id="controls">
        <div class="row">
          <button class="btn-secondary" onclick="copyJSON()">複製 JSON</button>
          <button class="btn-primary" onclick="downloadJSON()">下載 JSON</button>
        </div>
        <div class="row">
          <button class="btn-secondary" onclick="undo()">復原 (Z)</button>
          <button class="btn-secondary" onclick="redo()">重做 (Shift+Z)</button>
        </div>
        <div class="row">
          <button class="btn-secondary" onclick="fitImageToScreen()">適應畫面 (F)</button>
          <button class="btn-danger" onclick="clearAll()">全部清除</button>
        </div>
        <input type="file" id="import-file" accept=".json" onchange="importJSON(event)">
      </div>
    </div>
    <div id="canvas-area">
      <div id="help">
        <strong>快捷鍵</strong><br>
        滾輪 = 縮放（以滑鼠為中心）<br>
        空白鍵 + 拖曳 = 移動畫布<br>
        拖曳框 = 移動位置<br>
        拖曳把手 = 調整大小<br>
        方向鍵 = 微調 1px<br>
        C = 複製框大小，V = 貼上大小<br>
        Z = 復原，Shift+Z = 重做
      </div>
      <div id="canvas">
        <img id="map-img" src="../public/map.jpg" alt="漫博地圖">
      </div>
      <div id="zoom-controls">
        <button onclick="zoomBy(-0.2)">−</button>
        <button onclick="zoomBy(0.2)">+</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <script>
    const img = document.getElementById('map-img');
    const canvas = document.getElementById('canvas');
    const listEl = document.getElementById('list');
    const area = document.getElementById('canvas-area');
    const scaleBadge = document.getElementById('scale-badge');
    const toastEl = document.getElementById('toast');

    const state = {
      scale: 0.45,
      panX: 0,
      panY: 0,
      isPanning: false,
      isDrawing: false,
      isDragging: false,
      isResizing: false,
      dragBoxId: null,
      resizeHandle: null,
      startX: 0,
      startY: 0,
      boxes: [],
      selectedId: null,
      naturalWidth: 0,
      naturalHeight: 0,
      copiedBox: null,
      history: [],
      historyIndex: -1,
      spaceDown: false,
    };

    function saveHistory() {
      // remove redo steps
      state.history = state.history.slice(0, state.historyIndex + 1);
      state.history.push(JSON.parse(JSON.stringify(state.boxes)));
      if (state.history.length > 50) state.history.shift();
      else state.historyIndex++;
      persist();
    }

    function undo() {
      if (state.historyIndex <= 0) return;
      state.historyIndex--;
      state.boxes = JSON.parse(JSON.stringify(state.history[state.historyIndex]));
      state.selectedId = null;
      renderAll();
      showToast('已復原');
    }

    function redo() {
      if (state.historyIndex >= state.history.length - 1) return;
      state.historyIndex++;
      state.boxes = JSON.parse(JSON.stringify(state.history[state.historyIndex]));
      state.selectedId = null;
      renderAll();
      showToast('已重做');
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 1500);
    }

    function persist() {
      try {
        localStorage.setItem('annotate-boxes', JSON.stringify(state.boxes));
      } catch {}
    }

    function loadPersist() {
      try {
        const saved = localStorage.getItem('annotate-boxes');
        if (saved) {
          state.boxes = JSON.parse(saved);
        }
      } catch {}
    }

    function renderTransform() {
      canvas.style.transform = `translate(calc(-50% + ${state.panX}px), calc(-50% + ${state.panY}px)) scale(${state.scale})`;
      scaleBadge.textContent = Math.round(state.scale * 100) + '%';
    }

    function onImageLoad() {
      state.naturalWidth = img.naturalWidth;
      state.naturalHeight = img.naturalHeight;
      fitImageToScreen();
      renderAll();
    }

    img.onload = onImageLoad;
    if (img.complete && img.naturalWidth) onImageLoad();

    window.addEventListener('resize', fitImageToScreen);

    function fitImageToScreen() {
      if (!state.naturalWidth || !state.naturalHeight) return;
      const availW = area.clientWidth;
      const availH = area.clientHeight;
      const scaleX = availW / state.naturalWidth;
      const scaleY = availH / state.naturalHeight;
      state.scale = Math.min(scaleX, scaleY) * 0.95;
      state.panX = 0;
      state.panY = 0;
      renderTransform();
    }

    function pxToPercent(x, y, w, h) {
      return {
        x: (x / state.naturalWidth) * 100,
        y: (y / state.naturalHeight) * 100,
        w: (w / state.naturalWidth) * 100,
        h: (h / state.naturalHeight) * 100,
      };
    }

    function pctToPx(pct) {
      return {
        x: (pct.x / 100) * state.naturalWidth,
        y: (pct.y / 100) * state.naturalHeight,
        w: (pct.w / 100) * state.naturalWidth,
        h: (pct.h / 100) * state.naturalHeight,
      };
    }

    function getImagePoint(e) {
      const rect = img.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) / state.scale,
        y: (e.clientY - rect.top) / state.scale,
      };
    }

    function addBox(x, y, w, h) {
      const id = state.boxes.length > 0 ? Math.max(...state.boxes.map(b => b.id)) + 1 : 1;
      const pct = pxToPercent(x, y, w, h);
      state.boxes.push({ id, name: `攤位 ${id}`, bbox: pct });
      state.selectedId = id;
      saveHistory();
      renderAll();
    }

    function updateSelectedName(name) {
      const box = state.boxes.find(b => b.id === state.selectedId);
      if (box) {
        box.name = name;
        renderBoxes();
        renderList();
        persist();
      }
    }

    function deleteSelected() {
      if (!state.selectedId) return;
      state.boxes = state.boxes.filter(b => b.id !== state.selectedId);
      state.selectedId = null;
      saveHistory();
      renderAll();
    }

    function clearAll() {
      if (!confirm('確定要清除所有攤位嗎？')) return;
      state.boxes = [];
      state.selectedId = null;
      saveHistory();
      renderAll();
    }

    function selectBox(id) {
      state.selectedId = id;
      renderBoxes();
      renderList();
    }

    function renderAll() {
      renderBoxes();
      renderList();
    }

    function renderBoxes() {
      document.querySelectorAll('.bbox, .handle').forEach(el => el.remove());
      if (!state.naturalWidth || !state.naturalHeight) return;

      state.boxes.forEach(box => {
        const el = document.createElement('div');
        el.className = `bbox ${box.id === state.selectedId ? 'selected' : ''}`;
        el.style.left = `${box.bbox.x}%`;
        el.style.top = `${box.bbox.y}%`;
        el.style.width = `${box.bbox.w}%`;
        el.style.height = `${box.bbox.h}%`;

        const label = document.createElement('div');
        label.className = 'bbox-label';
        label.textContent = box.name;
        el.appendChild(label);

        el.addEventListener('mousedown', (e) => {
          if (state.spaceDown) {
            startPan(e);
            return;
          }
          e.stopPropagation();
          state.isDragging = true;
          state.dragBoxId = box.id;
          state.startX = e.clientX;
          state.startY = e.clientY;
          selectBox(box.id);
        });

        canvas.appendChild(el);

        if (box.id === state.selectedId) {
          ['nw', 'ne', 'sw', 'se', 'n', 's', 'w', 'e'].forEach(handle => {
            const h = document.createElement('div');
            h.className = `handle ${handle}`;
            h.addEventListener('mousedown', (e) => {
              e.stopPropagation();
              state.isResizing = true;
              state.resizeHandle = handle;
              state.dragBoxId = box.id;
              state.startX = e.clientX;
              state.startY = e.clientY;
            });
            el.appendChild(h);
          });
        }
      });
    }

    function renderList() {
      listEl.innerHTML = '';
      state.boxes.forEach(box => {
        const item = document.createElement('div');
        item.className = `item ${box.id === state.selectedId ? 'active' : ''}`;

        const nameEl = document.createElement('div');
        nameEl.className = 'item-name';
        nameEl.textContent = box.name;

        const coordsEl = document.createElement('div');
        coordsEl.className = 'item-coords';
        coordsEl.textContent = `${box.bbox.x.toFixed(2)}%, ${box.bbox.y.toFixed(2)}%, ${box.bbox.w.toFixed(2)}%, ${box.bbox.h.toFixed(2)}%`;

        item.appendChild(nameEl);
        item.appendChild(coordsEl);
        item.addEventListener('click', () => selectBox(box.id));
        listEl.appendChild(item);
      });

      if (state.selectedId) {
        const box = state.boxes.find(b => b.id === state.selectedId);
        if (box) {
          const form = document.createElement('div');
          form.className = 'item active';

          const group1 = document.createElement('div');
          group1.className = 'form-group';
          const label1 = document.createElement('label');
          label1.textContent = '攤位名稱';
          const inputName = document.createElement('input');
          inputName.type = 'text';
          inputName.value = box.name;
          inputName.addEventListener('input', (e) => updateSelectedName(e.target.value));
          group1.appendChild(label1);
          group1.appendChild(inputName);

          const group2 = document.createElement('div');
          group2.className = 'form-group';
          const label2 = document.createElement('label');
          label2.textContent = '座標 (%)';
          const inputCoords = document.createElement('input');
          inputCoords.type = 'text';
          inputCoords.value = `${box.bbox.x.toFixed(2)}, ${box.bbox.y.toFixed(2)}, ${box.bbox.w.toFixed(2)}, ${box.bbox.h.toFixed(2)}`;
          inputCoords.readOnly = true;
          group2.appendChild(label2);
          group2.appendChild(inputCoords);

          form.appendChild(group1);
          form.appendChild(group2);
          listEl.appendChild(form);
        }
      }
    }

    function getExportData() {
      return state.boxes.map((b, idx) => ({
        id: idx + 1,
        name: b.name,
        bbox: {
          x: Number(b.bbox.x.toFixed(2)),
          y: Number(b.bbox.y.toFixed(2)),
          w: Number(b.bbox.w.toFixed(2)),
          h: Number(b.bbox.h.toFixed(2)),
        },
      }));
    }

    function copyJSON() {
      const json = JSON.stringify(getExportData(), null, 2);
      navigator.clipboard.writeText(json).then(() => showToast('已複製 JSON'));
    }

    function downloadJSON() {
      const json = JSON.stringify(getExportData(), null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'booths.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const text = e.target && e.target.result;
          if (typeof text !== 'string') {
            alert('讀取檔案失敗');
            return;
          }
          const data = JSON.parse(text);
          if (!Array.isArray(data)) {
            alert('JSON 格式錯誤：應該是陣列');
            return;
          }
          state.boxes = data.map((item, idx) => ({
            id: item.id || idx + 1,
            name: item.name || `攤位 ${idx + 1}`,
            bbox: item.bbox || { x: 0, y: 0, w: 5, h: 5 },
          }));
          state.selectedId = state.boxes.length > 0 ? state.boxes[0].id : null;
          saveHistory();
          renderAll();
        } catch (err) {
          alert('JSON 解析失敗：' + err.message);
        }
      };
      reader.onerror = () => alert('檔案讀取失敗');
      reader.readAsText(file);
    }

    function startPan(e) {
      state.isPanning = true;
      state.startX = e.clientX - state.panX;
      state.startY = e.clientY - state.panY;
      canvas.style.cursor = 'grabbing';
    }

    function zoomBy(delta) {
      const cx = area.clientWidth / 2;
      const cy = area.clientHeight / 2;
      zoomAt(cx, cy, delta);
    }

    function zoomAt(screenX, screenY, delta) {
      const oldScale = state.scale;
      const newScale = Math.max(0.05, Math.min(6, state.scale + delta));

      const imgX = (screenX - area.clientWidth / 2 - state.panX) / oldScale;
      const imgY = (screenY - area.clientHeight / 2 - state.panY) / oldScale;

      state.panX = (screenX - area.clientWidth / 2) - imgX * newScale;
      state.panY = (screenY - area.clientHeight / 2) - imgY * newScale;
      state.scale = newScale;
      renderTransform();
    }

    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 1 || e.button === 2 || state.spaceDown) {
        startPan(e);
        return;
      }
      if (e.target !== canvas) return;

      const pt = getImagePoint(e);
      state.isDrawing = true;
      state.startX = pt.x;
      state.startY = pt.y;
      state.selectedId = null;
      renderAll();

      const preview = document.createElement('div');
      preview.id = 'draw-preview';
      preview.className = 'bbox dragging';
      canvas.appendChild(preview);
    });

    window.addEventListener('mousemove', (e) => {
      if (state.isPanning) {
        state.panX = e.clientX - state.startX;
        state.panY = e.clientY - state.startY;
        renderTransform();
        return;
      }

      if (state.isDragging && state.dragBoxId != null) {
        const dx = (e.clientX - state.startX) / state.scale;
        const dy = (e.clientY - state.startY) / state.scale;
        const box = state.boxes.find(b => b.id === state.dragBoxId);
        if (box) {
          const px = pctToPx(box.bbox);
          px.x += dx;
          px.y += dy;
          box.bbox = pxToPercent(px.x, px.y, px.w, px.h);
          state.startX = e.clientX;
          state.startY = e.clientY;
          renderBoxes();
          renderList();
        }
        return;
      }

      if (state.isResizing && state.dragBoxId != null) {
        const dx = (e.clientX - state.startX) / state.scale;
        const dy = (e.clientY - state.startY) / state.scale;
        const box = state.boxes.find(b => b.id === state.dragBoxId);
        if (box) {
          const px = pctToPx(box.bbox);
          switch (state.resizeHandle) {
            case 'se':
              px.w += dx; px.h += dy; break;
            case 'sw':
              px.w -= dx; px.h += dy; px.x += dx; break;
            case 'ne':
              px.w += dx; px.h -= dy; px.y += dy; break;
            case 'nw':
              px.w -= dx; px.h -= dy; px.x += dx; px.y += dy; break;
            case 'n':
              px.h -= dy; px.y += dy; break;
            case 's':
              px.h += dy; break;
            case 'w':
              px.w -= dx; px.x += dx; break;
            case 'e':
              px.w += dx; break;
          }
          if (px.w < 5) px.w = 5;
          if (px.h < 5) px.h = 5;
          box.bbox = pxToPercent(px.x, px.y, px.w, px.h);
          state.startX = e.clientX;
          state.startY = e.clientY;
          renderBoxes();
          renderList();
        }
        return;
      }

      if (!state.isDrawing) return;
      const pt = getImagePoint(e);
      const x = Math.min(state.startX, pt.x);
      const y = Math.min(state.startY, pt.y);
      const w = Math.abs(pt.x - state.startX);
      const h = Math.abs(pt.y - state.startY);
      const preview = document.getElementById('draw-preview');
      if (preview) {
        const pct = pxToPercent(x, y, w, h);
        preview.style.left = `${pct.x}%`;
        preview.style.top = `${pct.y}%`;
        preview.style.width = `${pct.w}%`;
        preview.style.height = `${pct.h}%`;
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (state.isPanning) {
        state.isPanning = false;
        canvas.style.cursor = 'crosshair';
        return;
      }
      if (state.isDragging) {
        state.isDragging = false;
        state.dragBoxId = null;
        saveHistory();
        return;
      }
      if (state.isResizing) {
        state.isResizing = false;
        state.resizeHandle = null;
        state.dragBoxId = null;
        saveHistory();
        return;
      }
      if (!state.isDrawing) return;
      state.isDrawing = false;
      const preview = document.getElementById('draw-preview');
      if (preview) preview.remove();
      const pt = getImagePoint(e);
      const x = Math.min(state.startX, pt.x);
      const y = Math.min(state.startY, pt.y);
      const w = Math.abs(pt.x - state.startX);
      const h = Math.abs(pt.y - state.startY);
      if (w > 10 && h > 10) {
        addBox(x, y, w, h);
      }
    });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.15 : 0.15;
      zoomAt(e.clientX - area.getBoundingClientRect().left, e.clientY - area.getBoundingClientRect().top, delta);
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        state.spaceDown = true;
        canvas.style.cursor = 'grab';
        return;
      }

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) redo();
        else undo();
        return;
      }

      if (e.key.toLowerCase() === 'z' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        undo();
        return;
      }

      if (e.key.toLowerCase() === 'c') {
        const box = state.boxes.find(b => b.id === state.selectedId);
        if (box) {
          state.copiedBox = { w: box.bbox.w, h: box.bbox.h };
          showToast('已複製大小');
        }
        return;
      }

      if (e.key.toLowerCase() === 'v') {
        const box = state.boxes.find(b => b.id === state.selectedId);
        if (box && state.copiedBox) {
          box.bbox.w = state.copiedBox.w;
          box.bbox.h = state.copiedBox.h;
          saveHistory();
          renderAll();
          showToast('已貼上大小');
        }
        return;
      }

      if (e.key.toLowerCase() === 'f') {
        fitImageToScreen();
        return;
      }

      if (e.key === 'Delete' || e.key === 'Backspace') {
        const active = document.activeElement;
        if (active && active.tagName === 'INPUT') return;
        deleteSelected();
        return;
      }

      if (state.selectedId) {
        const box = state.boxes.find(b => b.id === state.selectedId);
        if (!box) return;
        const stepPx = 1 / state.scale;
        const px = pctToPx(box.bbox);
        let moved = false;
        if (e.key === 'ArrowLeft') { px.x -= stepPx; moved = true; }
        else if (e.key === 'ArrowRight') { px.x += stepPx; moved = true; }
        else if (e.key === 'ArrowUp') { px.y -= stepPx; moved = true; }
        else if (e.key === 'ArrowDown') { px.y += stepPx; moved = true; }
        if (moved) {
          e.preventDefault();
          box.bbox = pxToPercent(px.x, px.y, px.w, px.h);
          saveHistory();
          renderAll();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        state.spaceDown = false;
        canvas.style.cursor = 'crosshair';
      }
    });

    loadPersist();
    if (state.boxes.length > 0 && state.naturalWidth) {
      renderAll();
    }

    renderTransform();
  </script>
</body>
</html>
